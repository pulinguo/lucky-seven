<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0711">
<title>LUCKY SEVEN · 幸运老虎机</title>
<style>
  :root{
    --gold:#ffd166;
    --gold-deep:#c9922f;
    --red:#e5484d;
    --ink:#0a0711;
    --cell-gap:10px;
    --radius:22px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100%;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:#efe7ff;
    background:
      radial-gradient(900px 600px at 18% -10%, rgba(124,58,237,.30), transparent 60%),
      radial-gradient(800px 520px at 88% 8%, rgba(229,72,77,.20), transparent 60%),
      radial-gradient(900px 700px at 50% 115%, rgba(255,183,3,.13), transparent 65%),
      #080510;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(rgba(255,255,255,.055) 1px, transparent 1px);
    background-size:26px 26px;
    mask-image:radial-gradient(circle at 50% 40%, #000 35%, transparent 85%);
  }

  .app{
    position:relative;z-index:1;
    width:min(560px, 100%);
    margin:0 auto;
    padding:22px 16px 34px;
    display:flex;flex-direction:column;gap:16px;
  }

  /* ---------- 顶部 ---------- */
  .masthead{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-7{
    width:46px;height:46px;border-radius:14px;
    display:grid;place-items:center;
    font:900 28px/1 Georgia,"Times New Roman",serif;
    color:#2b0a00;
    background:linear-gradient(160deg,#fff0b8,#ffc93c 45%,#ff8a00);
    box-shadow:0 6px 18px rgba(255,150,0,.35), inset 0 1px 0 #fff8d0, inset 0 -3px 0 rgba(140,60,0,.35);
    text-shadow:0 1px 0 rgba(255,255,255,.6);
  }
  .brand h1{
    margin:0;font-size:19px;letter-spacing:.20em;font-weight:800;
    background:linear-gradient(180deg,#fff6d5,#ffca4a 60%,#e39a16);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand p{margin:3px 0 0;font-size:11px;letter-spacing:.16em;color:#a493c9}

  .hud{display:flex;gap:8px}
  .chip{
    min-width:86px;
    padding:7px 11px 8px;
    border-radius:13px;
    background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.09);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  }
  .chip span{display:block;font-size:10px;letter-spacing:.16em;color:#9c8bbf}
  .chip b{display:block;font-size:16px;font-variant-numeric:tabular-nums;color:#fff3cf;letter-spacing:.02em}
  .chip.jack{border-color:rgba(255,196,60,.35);background:linear-gradient(180deg, rgba(255,196,60,.14), rgba(255,120,0,.05))}
  .chip.jack b{color:#ffd166;text-shadow:0 0 16px rgba(255,190,60,.45)}
  .chip.jack.bump{animation:bump .6s ease}
  @keyframes bump{0%,100%{transform:scale(1)}35%{transform:scale(1.08)}}

  /* ---------- 机箱 ---------- */
  .cabinet{
    position:relative;
    padding:16px 16px 12px;
    border-radius:30px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,0) 34%),
      linear-gradient(180deg,#2c1a44 0%, #190e29 52%, #0e0818 100%);
    box-shadow:
      0 0 0 2px #d9a441,
      0 0 0 5px #0d0716,
      0 0 0 6px rgba(217,164,65,.30),
      0 34px 70px -24px rgba(0,0,0,.95),
      inset 0 1px 0 rgba(255,255,255,.14);
  }
  .cabinet::before{
    content:"";position:absolute;inset:8px;border-radius:23px;pointer-events:none;
    border:1px solid rgba(255,209,102,.14);
  }
  .reel-wrap{
    position:relative;
    width:min(100%, 430px);
    margin:0 auto;
    padding:13px;
    border-radius:20px;
    background:linear-gradient(180deg, rgba(6,2,12,.92), rgba(26,12,42,.92));
    box-shadow:
      inset 0 0 46px rgba(0,0,0,.95),
      inset 0 0 0 1px rgba(255,255,255,.07),
      0 0 34px rgba(124,58,237,.22);
    overflow:hidden;
  }
  .reels{
    position:relative;z-index:2;
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:var(--cell-gap);
  }
  .reel{position:relative;overflow:hidden;border-radius:16px}
  .strip{
    display:grid;gap:var(--cell-gap);
    will-change:transform;
  }
  .reel.spinning .strip{
    animation:jitter .1s linear infinite;
  }
  /* 转动期间关掉符号投影，避免手机上每帧重绘滤镜导致掉帧 */
  .reel.spinning .sym{filter:none !important}
  .reel.spinning::after{
    content:"";position:absolute;inset:0;pointer-events:none;border-radius:16px;
    background:linear-gradient(180deg, rgba(255,255,255,.10), transparent 30%, transparent 70%, rgba(255,255,255,.10));
  }
  @keyframes jitter{
    0%{transform:translateY(-8px)}
    50%{transform:translateY(8px)}
    100%{transform:translateY(-8px)}
  }
  .strip.settle{animation:settle .3s cubic-bezier(.16,1.5,.4,1)}
  @keyframes settle{
    0%{transform:translateY(-16px)}
    62%{transform:translateY(3px)}
    100%{transform:translateY(0)}
  }

  .cell{
    position:relative;
    aspect-ratio:1/1;
    display:grid;place-items:center;
    border-radius:16px;
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.11), transparent 56%),
      linear-gradient(180deg,#261637,#150c23 78%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.07),
      inset 0 -12px 22px rgba(0,0,0,.6),
      0 5px 12px rgba(0,0,0,.45);
    transition:box-shadow .18s ease, transform .18s ease;
  }
  .cell::before{
    content:"";position:absolute;left:8%;right:8%;top:5px;height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
  }
  .cell::after{
    content:"";position:absolute;inset:-30%;
    background:linear-gradient(105deg, transparent 42%, rgba(255,255,255,.22) 50%, transparent 58%);
    transform:translateX(-130%);pointer-events:none;
  }
  .cell.hit{
    box-shadow:
      inset 0 0 0 2px rgba(255,214,120,.95),
      inset 0 0 26px rgba(255,176,32,.45),
      0 0 26px rgba(255,170,30,.55);
    animation:hitPulse 1.1s ease-in-out infinite;
    z-index:3;
  }
  .cell.hit::after{animation:sheen 1.2s ease-out}
  @keyframes hitPulse{
    0%,100%{transform:scale(1)}
    45%{transform:scale(1.045)}
  }
  @keyframes sheen{0%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
  .cell.preview{
    box-shadow:inset 0 0 0 2px rgba(120,200,255,.85), 0 0 22px rgba(90,170,255,.45);
  }

  .sym{
    position:relative;z-index:1;
    font-size:clamp(30px, 9.2vw, 52px);
    line-height:1;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.55));
    transition:transform .18s ease;
    user-select:none;
  }
  .cell.hit .sym{transform:scale(1.1)}
  .s-seven{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:900;
    background:linear-gradient(180deg,#fff9d9 0%,#ffd34d 42%,#ff9b00 72%,#e2461b 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sym.s-seven{
    font-size:clamp(38px, 11.5vw, 64px);
    filter:drop-shadow(0 3px 0 rgba(110,30,0,.55)) drop-shadow(0 0 16px rgba(255,140,0,.55));
  }
  .sym.s-diamond{filter:drop-shadow(0 0 12px rgba(120,220,255,.65))}
  .sym.s-bell{filter:drop-shadow(0 0 10px rgba(255,215,90,.55))}

  .payline-layer{
    position:absolute;left:13px;top:13px;right:13px;bottom:13px;
    z-index:6;pointer-events:none;
  }
  .pline{
    position:absolute;height:4px;border-radius:2px;
    transform-origin:0 50%;opacity:.95;
  }
  .pline-dot{
    position:absolute;width:7px;height:7px;border-radius:50%;
  }
  .payline-layer.preview .pline{opacity:.55}
  .payline-layer.preview .pline-dot{opacity:.7}

  .glass{
    position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:20px;
    background:
      linear-gradient(112deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.02) 26%, transparent 45%),
      radial-gradient(80% 50% at 50% 0%, rgba(255,255,255,.07), transparent 70%);
    box-shadow:inset 0 0 60px rgba(0,0,0,.65);
  }

  .win-float{
    position:absolute;left:50%;top:46%;z-index:6;
    transform:translate(-50%,-50%) scale(.85);
    font:900 clamp(26px,7vw,40px)/1 "Segoe UI",sans-serif;
    color:#fff4c9;letter-spacing:.02em;
    text-shadow:0 0 18px rgba(255,180,40,.85), 0 4px 0 rgba(120,50,0,.5);
    opacity:0;pointer-events:none;white-space:nowrap;
  }
  .win-float.show{animation:floatUp 1.5s cubic-bezier(.2,.9,.3,1) forwards}
  @keyframes floatUp{
    0%{opacity:0;transform:translate(-50%,-40%) scale(.7)}
    18%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}
    70%{opacity:1;transform:translate(-50%,-60%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-95%) scale(.95)}
  }

  .fs-badge{
    padding:4px 10px;border-radius:999px;white-space:nowrap;
    font-size:10.5px;letter-spacing:.06em;font-weight:700;
    color:#2a0d00;background:linear-gradient(180deg,#ffe89a,#ffb703);
    box-shadow:0 4px 14px rgba(255,150,0,.45);
    animation:badgePulse 1.6s ease-in-out infinite;
  }
  .fs-badge b{font-variant-numeric:tabular-nums}
  .cabinet.free-mode{
    box-shadow:
      0 0 0 2px #ffd166,
      0 0 0 5px #0d0716,
      0 0 0 6px rgba(255,209,102,.55),
      0 0 64px rgba(255,186,60,.35),
      0 34px 70px -24px rgba(0,0,0,.95),
      inset 0 1px 0 rgba(255,255,255,.14);
  }
  @keyframes badgePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  .cabinet-foot{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 6px 2px;
  }
  .foot-left{display:flex;align-items:center;gap:10px;min-width:0}
  .line-dots{display:flex;gap:7px;align-items:center}
  .line-dot{
    width:19px;height:19px;border-radius:50%;
    display:grid;place-items:center;
    font:700 10px/1 "Segoe UI",sans-serif;color:#0a0711;
    border:none;cursor:pointer;padding:0;
    box-shadow:0 2px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .15s ease;
  }
  .line-dot:hover,.line-dot:focus-visible{transform:translateY(-2px) scale(1.12);outline:none}
  .hint{font-size:11px;color:#9385b5;letter-spacing:.06em}
  .linkbtn{
    background:none;border:none;padding:4px 2px;cursor:pointer;
    color:#b3a1d6;font-size:11px;letter-spacing:.08em;font-family:inherit;
    text-decoration:underline dotted rgba(179,161,214,.5);text-underline-offset:3px;
    transition:color .15s ease;
  }
  .linkbtn:hover,.linkbtn:focus-visible{color:#ffd166;outline:none}

  /* ---------- 控制区 ---------- */
  .controls{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:12px;
  }
  .bet-group{
    display:flex;align-items:center;gap:8px;justify-self:start;
    padding:7px;border-radius:18px;
    background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.08);
  }
  .rbtn{
    width:36px;height:36px;border-radius:12px;cursor:pointer;
    border:1px solid rgba(255,255,255,.14);
    background:linear-gradient(180deg,#3a2757,#241537);
    color:#ffe9b0;font-size:20px;line-height:1;font-weight:700;
    display:grid;place-items:center;
    transition:transform .12s ease, filter .12s ease;
  }
  .rbtn:hover:not(:disabled){filter:brightness(1.2)}
  .rbtn:active:not(:disabled){transform:scale(.94)}
  .rbtn:disabled{opacity:.4;cursor:not-allowed}
  .bet-read{display:flex;flex-direction:column;align-items:center;min-width:70px}
  .bet-read .k{font-size:9px;letter-spacing:.14em;color:#9a8abd}
  .bet-read b{font-size:19px;color:#ffe9b0;font-variant-numeric:tabular-nums;line-height:1.15}
  .bet-read .sub{font-size:10px;color:#9a8abd}
  .bet-read .sub i{font-style:normal;color:#ffd166;font-variant-numeric:tabular-nums}

  .spin{
    position:relative;
    width:104px;height:104px;border-radius:50%;
    border:none;cursor:pointer;
    display:grid;place-items:center;
    background:
      radial-gradient(circle at 50% 30%, #ffe9a3 0%, #ffc42e 32%, #f09000 62%, #b85c00 100%);
    box-shadow:
      0 0 0 4px #2a1430,
      0 0 0 7px #d9a441,
      0 14px 30px -8px rgba(255,140,0,.55),
      inset 0 2px 4px rgba(255,255,255,.55),
      inset 0 -8px 18px rgba(120,50,0,.45);
    color:#401500;
    transition:transform .12s ease, filter .2s ease;
    isolation:isolate;
  }
  .spin:hover:not(:disabled){filter:brightness(1.06)}
  .spin:active:not(:disabled){transform:scale(.95)}
  .spin:disabled{cursor:default;filter:saturate(.55) brightness(.8)}
  .spin-ring{
    position:absolute;inset:9px;border-radius:50%;
    border:1px dashed rgba(90,30,0,.35);
  }
  .spin-label{
    font:900 21px/1 "Segoe UI","Microsoft YaHei",sans-serif;
    letter-spacing:.10em;
    text-shadow:0 1px 0 rgba(255,255,255,.6);
    position:relative;z-index:1;
  }
  .spin.busy .spin-label{opacity:.65}
  .spin.busy{animation:spinBreath .9s ease-in-out infinite}
  @keyframes spinBreath{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}

  .side-group{
    justify-self:end;display:flex;flex-direction:column;gap:6px;
  }
  .tbtn{
    min-width:74px;padding:7px 10px;border-radius:11px;cursor:pointer;
    font-size:11.5px;letter-spacing:.06em;color:#cfc0ea;
    background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.11);
    transition:all .15s ease;
    font-family:inherit;
  }
  .tbtn:hover:not(:disabled){color:#fff;border-color:rgba(255,209,102,.45)}
  .tbtn.on{
    color:#2a1200;font-weight:700;
    background:linear-gradient(180deg,#ffe08a,#f5b32b);
    border-color:#ffd166;
    box-shadow:0 0 16px rgba(255,180,40,.35);
  }
  .tbtn b{font-variant-numeric:tabular-nums}

  /* ---------- 赔付表 ---------- */
  .paytable{
    display:flex;align-items:center;justify-content:space-between;gap:6px;
    padding:10px 12px;border-radius:16px;
    background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
    border:1px solid rgba(255,255,255,.07);
    overflow-x:auto;scrollbar-width:none;
  }
  .paytable::-webkit-scrollbar{display:none}
  .pay-item{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:44px}
  .pay-item .pi-sym{font-size:20px;line-height:1.1}
  .pay-item .pi-sym.s-seven{
    font-family:Georgia,serif;font-weight:900;
    background:linear-gradient(180deg,#fff3bc,#ff9b00);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .pay-item .pi-val{font-size:10px;color:#a99ac9;font-variant-numeric:tabular-nums}
  .pay-item .pi-val b{color:#ffd166}

  footer{
    text-align:center;font-size:10.5px;color:#6f6390;letter-spacing:.10em;
  }
  footer b{color:#a08fc6;font-weight:600}

  /* ---------- 弹层 ---------- */
  .coin{
    position:fixed;z-index:70;pointer-events:none;
    font-size:22px;line-height:1;will-change:transform,opacity;
  }

  .bigwin{
    position:fixed;inset:0;z-index:60;display:grid;place-items:center;
    pointer-events:none;opacity:0;transition:opacity .22s ease;
    background:radial-gradient(circle at 50% 45%, rgba(255,178,40,.26), rgba(6,3,12,.85) 62%);
  }
  .bigwin.show{opacity:1}
  .bigwin-inner{text-align:center;transform:scale(.65);transition:transform .4s cubic-bezier(.18,1.5,.4,1)}
  .bigwin.show .bigwin-inner{transform:scale(1)}
  .bw-kicker{
    font-size:clamp(17px,4vw,30px);letter-spacing:.34em;font-weight:800;
    color:#ffeaa9;text-shadow:0 0 26px rgba(255,170,0,.9);
  }
  .bw-amount{
    font-size:clamp(44px,11vw,88px);font-weight:900;line-height:1.1;
    background:linear-gradient(180deg,#fffbe2,#ffc93c 46%,#ff7a00);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 8px 26px rgba(255,140,0,.6));
    font-variant-numeric:tabular-nums;
  }
  .bigwin.jackpot .bw-kicker{color:#fff}
  .bigwin.jackpot .bw-amount{
    background:linear-gradient(180deg,#fff,#9ef0ff 40%,#37c6ff);
    filter:drop-shadow(0 8px 30px rgba(60,190,255,.75));
  }

  .modal{
    position:fixed;inset:0;z-index:80;display:grid;place-items:end center;
    background:rgba(4,2,10,.72);backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:opacity .2s ease;
    padding:20px;
  }
  .modal.show{opacity:1;pointer-events:auto}
  .sheet{
    width:min(520px,100%);max-height:82vh;overflow:auto;
    border-radius:24px;padding:20px 20px 24px;
    background:linear-gradient(180deg,#221335,#120a1e);
    border:1px solid rgba(255,209,102,.28);
    box-shadow:0 30px 80px rgba(0,0,0,.8);
    transform:translateY(24px);transition:transform .25s cubic-bezier(.2,.9,.3,1);
  }
  .modal.show .sheet{transform:translateY(0)}
  .sheet h2{margin:0 0 4px;font-size:17px;letter-spacing:.1em;color:#ffd98a}
  .sheet .sub{margin:0 0 14px;font-size:11.5px;color:#9c8bbf}
  .rules-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .rule-card{
    padding:11px 12px;border-radius:14px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
    font-size:12px;line-height:1.6;color:#c9bbe4;
  }
  .rule-card b{color:#ffd166}
  .table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px}
  .table th{
    text-align:left;font-weight:600;color:#9c8bbf;font-size:10.5px;
    letter-spacing:.1em;padding:6px 6px;border-bottom:1px solid rgba(255,255,255,.1);
  }
  .table td{padding:7px 6px;border-bottom:1px solid rgba(255,255,255,.05);color:#dcd1f2}
  .table td:last-child,.table th:last-child{text-align:right;color:#ffd166;font-variant-numeric:tabular-nums}
  .table tr.sep td{color:#ff9a9a;font-weight:600}
  .close-btn{
    width:100%;padding:12px;border-radius:14px;border:none;cursor:pointer;
    font:700 14px/1 "Segoe UI","Microsoft YaHei",sans-serif;letter-spacing:.1em;
    color:#301500;background:linear-gradient(180deg,#ffe08a,#f0b127);
  }
  .toast{
    position:fixed;left:50%;bottom:26px;z-index:90;
    transform:translate(-50%,20px);
    padding:10px 18px;border-radius:999px;
    font-size:12.5px;color:#fff2cf;
    background:rgba(35,18,52,.96);border:1px solid rgba(255,209,102,.35);
    box-shadow:0 10px 30px rgba(0,0,0,.6);
    opacity:0;pointer-events:none;transition:all .22s ease;
    white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .broke{animation:shake .45s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-6px)}40%{transform:translateX(6px)}
    60%{transform:translateX(-4px)}80%{transform:translateX(4px)}
  }

  @media (max-width:520px){
    .app{padding:14px 12px 26px;gap:13px}
    .masthead{justify-content:center}
    .brand h1{font-size:16px}
    .hud{width:100%;justify-content:space-between}
    .chip{flex:1;min-width:0}
    .controls{grid-template-columns:1fr auto;grid-template-areas:"bet bet" "spin side";row-gap:14px}
    .bet-group{grid-area:bet;justify-self:stretch;justify-content:center;gap:22px}
    .spin{grid-area:spin;justify-self:center;width:96px;height:96px}
    .side-group{grid-area:side;justify-self:end}
    .hint{display:none}
    .paytable{justify-content:flex-start;gap:12px}
  }
  /* 尊重「减弱动态效果」：只关装饰动画，卷轴转动必须保留（这是玩法反馈） */
  @media (prefers-reduced-motion: reduce){
    .fs-badge,.bigwin-inner,.coin,.spin.busy,.chip.jack.bump,.cell.hit{animation:none !important}
    .cell.hit{transform:none !important}
  }
</style>
</head>
<body>

<main class="app">
  <header class="masthead">
    <div class="brand">
      <div class="brand-7">7</div>
      <div>
        <h1>LUCKY SEVEN</h1>
        <p>幸运老虎机 · 5 条支付线</p>
      </div>
    </div>
    <div class="hud">
      <div class="chip"><span>余额</span><b id="balance">1,000</b></div>
      <div class="chip jack" id="jackChip"><span>进宝奖池</span><b id="jackpot">7,777</b></div>

      <button class="tbtn" id="autoBtn">自动 <b id="autoLeft">0</b></button>
      <button class="tbtn" id="turboBtn">加速</button>

  <section class="paytable" id="paytable" aria-label="赔付表"></section>

  <footer>仅供娱乐 · 不涉及真实货币 · <b>祝你好运</b></footer>
</main>

  <div class="bigwin-inner">
    <div class="bw-kicker" id="bwKicker">BIG WIN</div>

</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="sheet">
    <h2 id="modalTitle">玩法与赔付</h2>
    <p class="sub">从左到右，5 条支付线各自结算；两条相同符号也有小奖。</p>

    <div class="rules-grid">
      <div class="rule-card"><b>🎯 支付线</b><br>上、中、下三行 + 两条对角线，共 5 条。</div>
      <div class="rule-card"><b>💎 免费旋转</b><br>盘面出现 3 个以上钻石，获得 <b>5 次</b>免费旋转，所有奖励 <b>×2</b>。</div>
      <div class="rule-card"><b>7️⃣ 进宝奖池</b><br>中线开出 3 个 7，立即赢走整个奖池并重新累积。</div>
      <div class="rule-card"><b>🪙 提示</b><br>余额不足可点「领金币」补给，游戏会记住你的进度。</div>
    </div>

    <table class="table">
      <thead><tr><th>符号</th><th>三个相同</th><th>两个相同</th></tr></thead>
      <tbody id="payRows"></tbody>
    </table>

    <button class="close-btn" id="closeModal">知道了，开转</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  /* =========================================================
     1. 数值配置
     ========================================================= */
  const SYMBOLS = [
    { id:'seven',   icon:'7',  name:'幸运 7', w:2,  p3:500, p2:12 },
    { id:'diamond', icon:'💎', name:'钻石',    w:3,  p3:200, p2:6  },
    { id:'bell',    icon:'🔔', name:'铃铛',    w:5,  p3:80,  p2:2  },
    { id:'cherry',  icon:'🍒', name:'樱桃',    w:7,  p3:40,  p2:1  },
    { id:'lemon',   icon:'🍋', name:'柠檬',    w:9,  p3:22,  p2:0  },
    { id:'clover',  icon:'🍀', name:'四叶草',  w:11, p3:13,  p2:0  },
    { id:'star',    icon:'⭐', name:'星星',    w:13, p3:9,   p2:0  }
  ];
  const SCATTER_ID  = 'diamond';
  const FREE_SPINS  = 5;
  const FREE_MULT   = 2;
  const BET_STEPS   = [1, 2, 5, 10, 20, 50, 100];
  const START_BAL   = 1000;
  const JACKPOT_SEED = 7777;
  const SAVE_KEY    = 'lucky7.slots.v1';

  const LINES = [
    { name:'上线', cells:[[0,0],[1,0],[2,0]] },
    { name:'中线', cells:[[0,1],[1,1],[2,1]] },
    { name:'下线', cells:[[0,2],[1,2],[2,2]] },
    { name:'斜下', cells:[[0,0],[1,1],[2,2]] },
    { name:'斜上', cells:[[0,2],[1,1],[2,0]] }
  ];
  const LINE_COLORS = ['#ffd166', '#4be1c0', '#ff7ab6', '#7aa8ff', '#ff9f45'];

  const POOL = [];
  SYMBOLS.forEach(s => { for (let i = 0; i < s.w; i++) POOL.push(s); });

  /* =========================================================
     2. DOM
     ========================================================= */
  const $ = id => document.getElementById(id);
  const reelsEl   = $('reels');
  const lineLayer = $('lineLayer');
  const cabinetEl = document.querySelector('.cabinet');
  const lineDots  = $('lineDots');
  const paytable  = $('paytable');
  const balanceEl = $('balance');
  const jackpotEl = $('jackpot');
  const bestEl    = $('best');
  const betValEl  = $('betVal');
  const totalBetEl= $('totalBet');
  const autoLeftEl= $('autoLeft');
  const fsBadge   = $('fsBadge');
  const fsLeftEl  = $('fsLeft');
  const spinBtn   = $('spin');
  const betMinusBtn = $('betDown');
  const betPlusBtn  = $('betUp');
  const autoBtn   = $('autoBtn');
  const turboBtn  = $('turboBtn');
  const soundBtn  = $('soundBtn');
  const freeBtn   = $('freeBtn');
  const winFloat  = $('winFloat');
  const bigwin    = $('bigwin');
  const bwKicker  = $('bwKicker');
  const bwAmount  = $('bwAmount');
  const modal     = $('modal');
  const toastEl   = $('toast');

  /* =========================================================
     3. 工具函数
     ========================================================= */
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const fmt   = n => Math.round(n).toLocaleString('en-US');
  const rand  = arr => arr[(Math.random() * arr.length) | 0];
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  function weightedSymbol() {
    return POOL[(Math.random() * POOL.length) | 0];
  }

  function loadSave() {
    try { return JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') || {}; }
    catch (e) { return {}; }
  }
  function persist() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        balance: state.balance,
        best: state.best,
        jackpot: state.jackpot,
        betIdx: state.betIdx,
        muted: state.muted,
        turbo: state.turbo
      }));
    } catch (e) { /* 忽略 */ }
  }

  /* =========================================================
     4. 音效（WebAudio 合成，无外部资源）
     ========================================================= */
  const Snd = {
    ctx: null,
    muted: false,
    tickTimer: null,
    ensure() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        this.ctx = new AC();
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return true;
    },
    tone(freq, dur, type, vol, delay, slideTo) {
      if (this.muted || !this.ctx) return;
      const t0 = this.ctx.currentTime + (delay || 0);
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain).connect(this.ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    },
    click() { this.ensure(); this.tone(680, 0.05, 'triangle', 0.05); },
    tick() { this.tone(1050 + Math.random() * 420, 0.035, 'square', 0.018); },
    startTicks() {
      this.ensure();
      if (this.muted) return;
      clearInterval(this.tickTimer);
      this.tickTimer = setInterval(() => this.tick(), 72);
    },
    stopTicks() { clearInterval(this.tickTimer); this.tickTimer = null; },
    thud(i) {
      this.tone(190 - i * 22, 0.16, 'sine', 0.16, 0, 90);
      this.tone(520 + i * 60, 0.07, 'triangle', 0.07);
    },
    win(ratio) {
      this.ensure();
      if (this.muted) return;
      const scale = [523.25, 659.25, 783.99, 1046.5, 1318.5];
      const steps = ratio >= 5 ? 5 : ratio >= 1 ? 4 : 3;
      for (let i = 0; i < steps; i++) {
        this.tone(scale[i], 0.22, 'triangle', 0.09, i * 0.085);
      }
      if (ratio >= 5) this.tone(1567.98, 0.5, 'sine', 0.07, steps * 0.085);
    },
    jackpot() {
      this.ensure();
      if (this.muted) return;
      const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98, 2093];
      notes.forEach((f, i) => this.tone(f, 0.26, 'triangle', 0.10, i * 0.11));
      [523.25, 659.25, 783.99, 1046.5].forEach(f => this.tone(f, 1.5, 'sine', 0.06, 0.85));
    },
    free() {
      this.ensure();
      if (this.muted) return;
      [880, 1174.66, 1567.98, 2093].forEach((f, i) => this.tone(f, 0.18, 'sine', 0.08, i * 0.07));
    }
  };

  /* =========================================================
     5. 状态
     ========================================================= */
  const save = loadSave();
  const state = {
    balance: Number.isFinite(save.balance) ? save.balance : START_BAL,
    best: Number.isFinite(save.best) ? save.best : 0,
    jackpot: Number.isFinite(save.jackpot) ? save.jackpot : JACKPOT_SEED,
    betIdx: Number.isInteger(save.betIdx) ? clamp(save.betIdx, 0, BET_STEPS.length - 1) : 2,
    muted: !!save.muted,
    turbo: !!save.turbo,
    busy: false,
    autoLeft: 0,
    freeLeft: 0,
    freeSessionWin: 0,
    lastWin: 0
  };
  Snd.muted = state.muted;

  const cellEls = [[], [], []];
  const symEls  = [[], [], []];
  const reelEls = [];

  /* =========================================================
     6. 构建卷轴
     ========================================================= */
  function buildReels() {
    for (let c = 0; c < 3; c++) {
      const col = document.createElement('div');
      col.className = 'reel';
      col.dataset.col = String(c);
      const strip = document.createElement('div');
      strip.className = 'strip';

      for (let r = 0; r < 3; r++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        const sym = document.createElement('span');
        sym.className = 'sym';
        cell.appendChild(sym);
        strip.appendChild(cell);
        cellEls[c][r] = cell;
        symEls[c][r] = sym;
      }
      col.appendChild(strip);
      reelsEl.appendChild(col);
      reelEls[c] = col;
    }
  }

  function paint(c, r, sym) {
    const el = symEls[c][r];
    if (el.dataset.id === sym.id) return;
    el.dataset.id = sym.id;
    el.textContent = sym.icon;
    el.className = 'sym s-' + sym.id;
  }

  function paintGrid(grid) {
    for (let c = 0; c < 3; c++) {
      for (let r = 0; r < 3; r++) paint(c, r, grid[c][r]);
    }
  }

  /* =========================================================
     7. 结算
     ========================================================= */
  function evaluate(grid, lineBet, mult) {
    const wins = [];
    LINES.forEach((line, i) => {
      const s = line.cells.map(([c, r]) => grid[c][r]);
      let pay = 0, kind = 0;
      if (s[0].id === s[1].id && s[1].id === s[2].id) {
        pay = s[0].p3 * lineBet;
        kind = 3;
      } else if (s[0].id === s[1].id) {
        pay = (s[0].p2 || 0) * lineBet;
        kind = 2;
      }
      if (pay > 0) {
        wins.push({ line: i, pay: pay * mult, kind, sym: s[0], cells: line.cells });
      }
    });

    let diamonds = 0;
    for (let c = 0; c < 3; c++) {
      for (let r = 0; r < 3; r++) {
        if (grid[c][r].id === SCATTER_ID) diamonds++;
      }
    }
    const totalBet = lineBet * 5;
    let scatterPay = 0;
    if (diamonds >= 3) {
      const factor = diamonds >= 5 ? 30 : diamonds === 4 ? 10 : 3;
      scatterPay = factor * totalBet * mult;
    }
    const lineWin = wins.reduce((a, w) => a + w.pay, 0);
    return { wins, diamonds, scatterPay, total: lineWin + scatterPay };
  }

  /* =========================================================
     8. 支付线显示
     ========================================================= */
  function clearFx() {
    lineLayer.innerHTML = '';
    lineLayer.classList.remove('preview');
    winFloat.classList.remove('show');
    for (let c = 0; c < 3; c++) {
      for (let r = 0; r < 3; r++) cellEls[c][r].classList.remove('hit', 'preview');
    }
  }

  function drawLines(wins, preview) {
    lineLayer.innerHTML = '';
    lineLayer.classList.toggle('preview', !!preview);
    const base = lineLayer.getBoundingClientRect();

    wins.forEach(w => {
      const color = LINE_COLORS[w.line];
      const pts = w.cells.map(([c, r]) => {
        const b = cellEls[c][r].getBoundingClientRect();
        return {
          x: b.left - base.left + b.width / 2,
          y: b.top - base.top + b.height / 2
        };
      });

      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i];
        const b = pts[i + 1];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const len = Math.sqrt(dx * dx + dy * dy);
        const ang = Math.atan2(dy, dx) * 180 / Math.PI;

        const seg = document.createElement('span');
        seg.className = 'pline';
        seg.style.left = a.x + 'px';
        seg.style.top = (a.y - 2) + 'px';
        seg.style.width = len + 'px';
        seg.style.background = color;
        seg.style.boxShadow = '0 0 12px ' + color + ', 0 0 4px ' + color;
        seg.style.transform = 'rotate(' + ang + 'deg)';
        lineLayer.appendChild(seg);
      }

      pts.forEach(p => {
        const dot = document.createElement('span');
        dot.className = 'pline-dot';
        dot.style.left = (p.x - 3.5) + 'px';
        dot.style.top = (p.y - 3.5) + 'px';
        dot.style.background = color;
        dot.style.boxShadow = '0 0 10px ' + color;
        lineLayer.appendChild(dot);
      });
    });
  }

  function previewLine(i) {
    clearFx();
    const line = LINES[i];
    line.cells.forEach(([c, r]) => cellEls[c][r].classList.add('preview'));
    drawLines([{ line: i, cells: line.cells }], true);
  }

  /* =========================================================
     9. 特效
     ========================================================= */
  function floatWin(text) {
    winFloat.textContent = text;
    winFloat.classList.remove('show');
    void winFloat.offsetWidth;
    winFloat.classList.add('show');
  }

  let bwTimer = null;
  function banner(kicker, amount, cls) {
    bwKicker.textContent = kicker;
    bwAmount.textContent = amount;
    bigwin.className = 'bigwin show' + (cls ? ' ' + cls : '');
    clearTimeout(bwTimer);
    bwTimer = setTimeout(() => bigwin.classList.remove('show'), 2300);
  }

  function coinBurst(n, fromEl) {
    const rect = (fromEl || reelsEl).getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    for (let i = 0; i < n; i++) {
      const el = document.createElement('span');
      el.className = 'coin';
      el.textContent = '🪙';
      el.style.left = cx + 'px';
      el.style.top = cy + 'px';
      el.style.fontSize = (16 + Math.random() * 16) + 'px';
      document.body.appendChild(el);

      const ang = -Math.PI / 2 + (Math.random() - 0.5) * 2.3;
      const dist = 70 + Math.random() * 190;
      const dx = Math.cos(ang) * dist;
      const dy = Math.sin(ang) * dist;
      const spin = (Math.random() > 0.5 ? 1 : -1) * (180 + Math.random() * 360);

      const anim = el.animate([
        { transform: 'translate(-50%,-50%) scale(.35) rotate(0deg)', opacity: 1 },
        { transform: `translate(calc(-50% + ${dx * 0.75}px), calc(-50% + ${dy * 0.75}px)) scale(1.05) rotate(${spin * 0.6}deg)`, opacity: 1, offset: 0.55 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy + 210}px)) scale(.65) rotate(${spin}deg)`, opacity: 0 }
      ], { duration: 900 + Math.random() * 600, easing: 'cubic-bezier(.2,.7,.3,1)' });

      anim.onfinish = () => el.remove();
      anim.oncancel = () => el.remove();
    }
  }

  function rain(n) {
    for (let i = 0; i < n; i++) {
      const el = document.createElement('span');
      el.className = 'coin';
      el.textContent = Math.random() > 0.4 ? '🪙' : '✨';
      el.style.left = (Math.random() * 100) + 'vw';
      el.style.top = '-40px';
      el.style.fontSize = (16 + Math.random() * 18) + 'px';
      document.body.appendChild(el);
      const dur = 1600 + Math.random() * 1600;
      const anim = el.animate([
        { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
        { transform: `translateY(${window.innerHeight + 120}px) rotate(${(Math.random() - 0.5) * 720}deg)`, opacity: 0.9 }
      ], { duration: dur, delay: Math.random() * 700, easing: 'linear', fill: 'forwards' });
      anim.onfinish = () => el.remove();
    }
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('show'), 1900);
  }

  function animateNumber(el, from, to, dur) {
    const t0 = performance.now();
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(from + (to - from) * eased);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  /* =========================================================
     10. UI 同步
     ========================================================= */
  function totalBet() { return BET_STEPS[state.betIdx] * 5; }

  let balAnimUntil = 0;
  function syncHud(animateBalance) {
    const target = Math.max(0, Math.round(state.balance));
    if (animateBalance) {
      const from = parseFloat(balanceEl.textContent.replace(/,/g, '')) || 0;
      animateNumber(balanceEl, from, target, 520);
      balAnimUntil = performance.now() + 560;
    } else if (performance.now() > balAnimUntil) {
      balanceEl.textContent = fmt(target);
    }
    jackpotEl.textContent = fmt(state.jackpot);
    bestEl.textContent = fmt(state.best);
    betValEl.textContent = fmt(BET_STEPS[state.betIdx]);
    totalBetEl.textContent = fmt(totalBet());
    autoLeftEl.textContent = String(state.autoLeft);
    fsLeftEl.textContent = String(state.freeLeft);
    fsBadge.hidden = state.freeLeft <= 0;
    if (cabinetEl) cabinetEl.classList.toggle('free-mode', state.freeLeft > 0);
  }

  function syncControls() {
    const locked = state.busy;
    betMinusBtn.disabled = locked || state.betIdx <= 0;
    betPlusBtn.disabled = locked || state.betIdx >= BET_STEPS.length - 1;
    spinBtn.disabled = locked;
    spinBtn.classList.toggle('busy', locked);
    autoBtn.classList.toggle('on', state.autoLeft > 0);
    turboBtn.classList.toggle('on', state.turbo);
    soundBtn.classList.toggle('on', !state.muted);
    autoBtn.querySelector('b').textContent = state.autoLeft > 0 ? String(state.autoLeft) : '';
    soundBtn.textContent = state.muted ? '音效 关' : '音效';
    freeBtn.disabled = locked;
  }

  /* =========================================================
     11. 转一次
     ========================================================= */
  /* 用 requestAnimationFrame 驱动转动：帧率跟着屏幕走，
     不会因为定时器被节流而直接跳到结果；同时保证至少转够 1 秒左右 */
  function animateSpin(grid, speed) {
    return new Promise(resolve => {
      const t0 = performance.now();
      const firstStop = 520 * speed;
      const stepStop = 180 * speed;
      const stopAt = [firstStop, firstStop + stepStop, firstStop + stepStop * 2];
      const endAt = stopAt[2] + 90;
      const stopped = [false, false, false];
      let lastSwap = -999;
      let finished = false;

      for (let c = 0; c < 3; c++) reelEls[c].classList.add('spinning');

      const finish = () => {
        if (finished) return;
        finished = true;
        for (let c = 0; c < 3; c++) {
          if (!stopped[c]) { stopped[c] = true; stopReel(c, grid); }
        }
        resolve();
      };

      /* 兜底：切后台 / 极端节流时也要收尾 */
      const safety = setTimeout(finish, endAt + 1000);

      function frame(now) {
        if (finished) return;
        const t = now - t0;

        if (t - lastSwap >= 62) {
          lastSwap = t;
          for (let c = 0; c < 3; c++) {
            if (stopped[c]) continue;
            for (let r = 0; r < 3; r++) paint(c, r, weightedSymbol());
          }
        }

        for (let c = 0; c < 3; c++) {
          if (!stopped[c] && t >= stopAt[c]) {
            stopped[c] = true;
            stopReel(c, grid);
            Snd.thud(c);
          }
        }

        if (t >= endAt) {
          clearTimeout(safety);
          finish();
          return;
        }
        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    });
  }

  function stopReel(c, grid) {
    reelEls[c].classList.remove('spinning');
    const strip = reelEls[c].firstElementChild;
    for (let r = 0; r < 3; r++) paint(c, r, grid[c][r]);
    strip.classList.remove('settle');
    void strip.offsetWidth;
    strip.classList.add('settle');
  }

  async function runOneSpin() {
    const lineBet = BET_STEPS[state.betIdx];
    const stake = lineBet * 5;
    const isFree = state.freeLeft > 0;

    if (!isFree) {
      if (state.balance < stake) {
        state.autoLeft = 0;
        syncHud();
        syncControls();
        freeBtn.classList.remove('broke');
        void freeBtn.offsetWidth;
        freeBtn.classList.add('broke');
        toast('金币不足，点「领金币」补给');
        return 'stop';
      }
      state.balance -= stake;
      state.jackpot += stake * 0.01;
      syncHud();
    }

    clearFx();

    const grid = [];
    for (let c = 0; c < 3; c++) {
      grid[c] = [];
      for (let r = 0; r < 3; r++) grid[c][r] = weightedSymbol();
    }

    const speed = state.turbo ? 0.55 : 1;
    Snd.startTicks();
    await animateSpin(grid, speed);
    Snd.stopTicks();
    await sleep(140);

    const mult = isFree ? FREE_MULT : 1;
    const res = evaluate(grid, lineBet, mult);

    /* 进宝奖池：中线三个 7 */
    const jackpotHit =
      grid[0][1].id === 'seven' &&
      grid[1][1].id === 'seven' &&
      grid[2][1].id === 'seven';
    let jackpotWin = 0;
    if (jackpotHit) {
      jackpotWin = Math.round(state.jackpot);
      state.jackpot = JACKPOT_SEED;
      document.getElementById('jackChip').classList.remove('bump');
      void document.getElementById('jackChip').offsetWidth;
      document.getElementById('jackChip').classList.add('bump');
    }

    /* 免费旋转触发 */
    let awarded = 0;
    if (res.diamonds >= 3) {
      awarded = res.diamonds >= 5 ? 10 : FREE_SPINS;
      state.freeLeft = Math.min(20, state.freeLeft + awarded);
      Snd.free();
    }

    const totalWin = res.total + jackpotWin;

    /* 中奖展示 */
    if (res.wins.length) {
      drawLines(res.wins);
      res.wins.forEach((w, i) => {
        w.cells.forEach(([c, r]) => {
          const cell = cellEls[c][r];
          cell.classList.add('hit');
          cell.style.animationDelay = (i * 90) + 'ms';
        });
      });
    }

    if (totalWin > 0) {
      const ratio = totalWin / Math.max(stake, 1);
      state.balance += totalWin;
      state.lastWin = totalWin;
      if (isFree) state.freeSessionWin += totalWin;
      if (totalWin > state.best) {
        state.best = totalWin;
        bestEl.textContent = fmt(state.best);
      }
      syncHud(true);
      floatWin('+' + fmt(totalWin));
      Snd.win(ratio);
      coinBurst(clamp(Math.round(totalWin / stake) + 6, 8, 34));
      if (ratio >= 15) {
        setTimeout(() => banner('BIG WIN', fmt(totalWin)), 260);
      }
    } else if (!jackpotHit) {
      syncHud();
    }

    if (jackpotWin > 0) {
      setTimeout(() => {
        banner('JACKPOT', fmt(jackpotWin), 'jackpot');
        Snd.jackpot();
        rain(46);
        coinBurst(40);
      }, 420);
    } else if (awarded > 0) {
      setTimeout(() => {
        banner(state.freeLeft > awarded ? '免费旋转 +' + awarded : '免费旋转', awarded + ' 次', 'free');
        toast('免费旋转 ×2 奖励！');
      }, 380);
    }

    syncHud();
    syncControls();
    persist();

    /* 结尾动画 */
    await sleep(560);

    if (jackpotWin > 0) await sleep(1400);

    if (isFree) {
      state.freeLeft = Math.max(0, state.freeLeft - 1);
      syncHud();
      if (state.freeLeft === 0) {
        const won = state.freeSessionWin;
        state.freeSessionWin = 0;
        if (won > 0) toast('免费旋转结束，共赢得 ' + fmt(won) + ' 金币');
      }
    }

    if (state.freeLeft > 0) return 'free';

    if (state.autoLeft > 0) {
      state.autoLeft--;
      syncHud();
      syncControls();
      if (state.autoLeft === 0) persist();
      return 'auto';
    }

    return 'done';
  }

  async function playLoop() {
    if (state.busy) return;
    Snd.ensure();
    state.busy = true;
    syncControls();

    let next = 'auto';
    let guard = 0;
    while (next !== 'stop' && guard++ < 400) {
      try {
        next = await runOneSpin();
      } catch (err) {
        console.error(err);
        break;
      }
      if (next === 'free') { await sleep(620); continue; }
      if (next === 'auto') { await sleep(state.turbo ? 260 : 420); continue; }
      break;
    }

    state.busy = false;
    syncControls();
    syncHud();
    persist();
  }

  /* =========================================================
     12. 控件
     ========================================================= */
  function setBet(delta) {
    if (state.busy) return;
    const idx = clamp(state.betIdx + delta, 0, BET_STEPS.length - 1);
    if (idx === state.betIdx) return;
    state.betIdx = idx;
    Snd.click();
    syncHud();
    syncControls();
    persist();
  }

  function toggleAuto() {
    if (state.busy) {
      if (state.autoLeft > 0) { state.autoLeft = 0; syncControls(); toast('已停止自动旋转'); }
      return;
    }
    state.autoLeft = state.autoLeft > 0 ? 0 : 10;
    Snd.click();
    syncControls();
    if (state.autoLeft > 0) playLoop();
  }

  function toggleTurbo() {
    state.turbo = !state.turbo;
    Snd.click();
    syncControls();
    persist();
  }

  function toggleSound() {
    state.muted = !state.muted;
    Snd.muted = state.muted;
    if (!state.muted) Snd.click();
    syncControls();
    persist();
  }

  function freeCoins() {
    if (state.busy) return;
    if (state.balance >= 300 && state.balance >= totalBet()) {
      toast('金币还够，先转起来～');
      return;
    }
    state.balance += 500;
    Snd.free();
    coinBurst(14);
    toast('已领取 500 金币');
    syncHud(true);
    persist();
  }

  function openModal() {
    modal.classList.add('show');
    Snd.click();
  }
  function closeModal() {
    modal.classList.remove('show');
  }

  /* =========================================================
     13. 初始化界面
     ========================================================= */
  function buildPaytable() {
    paytable.innerHTML = '';
    SYMBOLS.forEach(s => {
      const item = document.createElement('div');
      item.className = 'pay-item';
      item.innerHTML =
        '<span class="pi-sym s-' + s.id + '">' + s.icon + '</span>' +
        '<span class="pi-val">×<b>' + s.p3 + '</b></span>';
      paytable.appendChild(item);
    });
    const sc = document.createElement('div');
    sc.className = 'pay-item';
    sc.innerHTML = '<span class="pi-sym">💎</span><span class="pi-val">3+ <b>免费</b></span>';
    paytable.appendChild(sc);

    /* 规则表 */
    const tbody = document.getElementById('payRows');
    tbody.innerHTML = '';
    SYMBOLS.forEach(s => {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td><span class="s-' + s.id + '" style="font-size:16px">' + s.icon + '</span> ' + s.name + '</td>' +
        '<td>' + s.p3 + ' × 线注</td>' +
        '<td>' + (s.p2 ? s.p2 + ' × 线注' : '—') + '</td>';
      tbody.appendChild(tr);
    });
    const tr2 = document.createElement('tr');
    tr2.className = 'sep';
    tr2.innerHTML = '<td>💎 3 / 4 / 5+ 个</td><td colspan="2" style="text-align:left">免费旋转 + 3× / 10× / 30× 总注</td>';
    tbody.appendChild(tr2);
    const tr3 = document.createElement('tr');
    tr3.innerHTML = '<td>7️⃣ 中线三个 7</td><td colspan="2" style="text-align:left">赢走整个进宝奖池</td>';
    tbody.appendChild(tr3);
  }

  function buildLineDots() {
    lineDots.innerHTML = '';
    LINES.forEach((line, i) => {
      const b = document.createElement('button');
      b.className = 'line-dot';
      b.style.background = LINE_COLORS[i];
      b.title = line.name + ' 支付线';
      b.setAttribute('aria-label', line.name + ' 支付线');
      b.textContent = String(i + 1);
      b.addEventListener('mouseenter', () => previewLine(i));
      b.addEventListener('mouseleave', clearFx);
      b.addEventListener('focus', () => previewLine(i));
      b.addEventListener('blur', clearFx);
      b.addEventListener('click', () => { previewLine(i); setTimeout(clearFx, 900); });
      lineDots.appendChild(b);
    });
  }

  function randomGrid() {
    return Array.from({ length: 3 }, () =>
      Array.from({ length: 3 }, weightedSymbol));
  }

  /* =========================================================
     14. 事件绑定
     ========================================================= */
  spinBtn.addEventListener('click', playLoop);
  betMinusBtn.addEventListener('click', () => setBet(-1));
  betPlusBtn.addEventListener('click', () => setBet(1));
  autoBtn.addEventListener('click', toggleAuto);
  turboBtn.addEventListener('click', toggleTurbo);
  soundBtn.addEventListener('click', toggleSound);
  freeBtn.addEventListener('click', freeCoins);
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('rulesBtn').addEventListener('click', openModal);

  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); return; }
    if (modal.classList.contains('show')) return;
    if (e.code === 'Space') {
      e.preventDefault();
      if (!state.busy) playLoop();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault(); setBet(1);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault(); setBet(-1);
    } else if (e.key.toLowerCase() === 'm') {
      toggleSound();
    }
  });

  window.addEventListener('resize', () => {
    lineLayer.innerHTML = '';
  });

  /* =========================================================
     15. 启动
     ========================================================= */
  buildReels();
  buildPaytable();
  buildLineDots();
  paintGrid(randomGrid());
  syncHud();
  syncControls();
  persist();

  /* 首次打开时给一点指引 */
  setTimeout(() => {
    if (state.balance === START_BAL && state.best === 0) {
      toast('点「旋转」开始 · 空格键也可以');
    }
  }, 900);

})();
</script>
</body>
